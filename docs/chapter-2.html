<!DOCTYPE html>
<html>
  <h1>Gallery/Visual Page</h1>
  <p style="color:DarkOrchid">Color Testing</p>
   <script>
  function color(numb) { 
    var img;
    if (numb==0) {
      img = "green-square.png"
    } else {
      img = "red-square.png"
    }
    document.getElementById("change-color").src = img;
  }
  </script>
    <img src="red-square.png" alt="Red Square" width="150" height="150">
  <p>
    <button type="button" onclick="color(0)">GO Button</button>
    <button type="button" onclick="color(1)">STOP Button</button>
  </p>
</html>
