  <h1>Chapter 2: Visuals Page</h1>
  <p style="color:DarkOrchid">A red square indicates stoppage, while a green square indicates going. Press the go or stop button to switch the action.</p>
   <script>
function color(numb) { 
    var img;
    if (numb == 0) {
      img = "red-square.png"
    } else {
      img = "bacterial-cell.jpg"
    }
    document.getElementById('myImage').src = img;
  }
  </script>
    <img id="myImage" src="red-square.png" alt="Red Square" width="200" height="200">
  <p>
    <button type="button" onclick="color(0)">STOP Button</button>
    <button type="button" onclick="color(1)">GO Button</button>
  </p>
